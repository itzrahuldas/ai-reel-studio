name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "chore/**"
      - "fix/**"
  pull_request:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_reel_studio_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_reel_studio_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: test
      DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ai_reel_studio_test
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/1
      SECRET_KEY: test-secret-key-for-ci-only-000000000000
      TOKEN_ENCRYPTION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      FRONTEND_URL: http://localhost:3000
      API_PUBLIC_BASE_URL: http://localhost:8000
      STORAGE_PUBLIC_BASE_URL: http://localhost:8000/static
      STORAGE_PROVIDER: local
      LOCAL_STORAGE_PATH: /tmp/ai-reel-studio-storage
      INSTAGRAM_INTEGRATION_MODE: mock
      STRIPE_MODE: mock
      AI_PROVIDER: mock
      IMAGE_ANALYSIS_PROVIDER: mock
      TTS_PROVIDER: mock
      GENERATION_MODE: sync
      RENDER_MODE: sync
      PUBLISH_MODE: sync
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: python -m ruff check .

      - name: Alembic upgrade
        run: alembic upgrade head

      - name: Alembic heads
        run: alembic heads

      - name: Alembic history
        run: alembic history -r base:head

      - name: Pytest
        run: pytest -q

      - name: Worker import validation
        working-directory: .
        env:
          PYTHONPATH: ${{ github.workspace }}/apps/worker:${{ github.workspace }}/apps/api
        run: |
          python - <<'PY'
          from app.main import celery_app
          import app.tasks.generate_reel
          import app.tasks.render_reel
          import app.tasks.publish_reel
          import app.tasks.scheduler

          print(celery_app.main)
          PY

  frontend:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
