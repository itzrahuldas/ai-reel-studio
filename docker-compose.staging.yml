version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required for staging}
      POSTGRES_DB: ${POSTGRES_DB:-ai_reel_studio_staging}
    volumes:
      - staging_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ai_reel_studio_staging}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - staging_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ${STAGING_ENV_FILE:-.env.staging}
    environment:
      APP_ENV: staging
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:?CELERY_BROKER_URL is required}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:?CELERY_RESULT_BACKEND is required}
      LOCAL_STORAGE_PATH: ${LOCAL_STORAGE_PATH:-/var/lib/ai-reel-studio/media}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - staging_media:${LOCAL_STORAGE_PATH:-/var/lib/ai-reel-studio/media}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  worker-generation: &worker-base
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    env_file:
      - ${STAGING_ENV_FILE:-.env.staging}
    environment:
      APP_ENV: staging
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:?CELERY_BROKER_URL is required}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:?CELERY_RESULT_BACKEND is required}
      PYTHONPATH: /app:/api_src
      LOCAL_STORAGE_PATH: ${LOCAL_STORAGE_PATH:-/var/lib/ai-reel-studio/media}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - staging_media:${LOCAL_STORAGE_PATH:-/var/lib/ai-reel-studio/media}
      - staging_worker_tmp:/tmp
    command: >
      celery -A app.main:celery_app worker
      --loglevel=info
      --concurrency=${GENERATION_WORKER_CONCURRENCY:-2}
      --queues=generation,default

  worker-rendering:
    <<: *worker-base
    command: >
      celery -A app.main:celery_app worker
      --loglevel=info
      --concurrency=${RENDER_WORKER_CONCURRENCY:-1}
      --queues=rendering

  worker-publishing:
    <<: *worker-base
    command: >
      celery -A app.main:celery_app worker
      --loglevel=info
      --concurrency=${PUBLISH_WORKER_CONCURRENCY:-2}
      --queues=publishing

  celery-beat:
    <<: *worker-base
    command: celery -A app.main:celery_app beat --loglevel=info

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
    restart: unless-stopped
    env_file:
      - ${STAGING_ENV_FILE:-.env.staging}
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  staging_postgres_data:
  staging_redis_data:
  staging_media:
  staging_worker_tmp:
