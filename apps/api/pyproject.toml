[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-reel-studio-api"
version = "0.1.0"
description = "AI Reel Studio — FastAPI Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic[email]>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "boto3>=1.34.0",
    "celery[redis]>=5.4.0",
    "redis>=5.0.0",
    "cryptography>=42.0.0",
    "slowapi>=0.1.9",
    "structlog>=24.1.0",
    "tenacity>=8.3.0",
    "aiofiles>=23.2.1",
    "python-dotenv>=1.0.0",
    "email-validator>=2.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "factory-boy>=3.3.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I", "N", "UP", "ANN", "S", "B", "A", "COM", "C4", "DTZ", "T20", "RET", "SIM", "ARG", "PTH", "ERA"]
ignore = ["ANN101", "ANN102", "S101", "COM812"]

[tool.ruff.per-file-ignores]
"tests/*" = ["ANN", "S", "ARG"]
"alembic/*" = ["ANN", "ERA"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
