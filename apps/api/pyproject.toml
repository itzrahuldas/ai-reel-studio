[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-reel-studio-api"
version = "0.1.0"
description = "AI Reel Studio — FastAPI Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic[email]>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "boto3>=1.34.0",
    "celery[redis]>=5.4.0",
    "redis>=5.0.0",
    "cryptography>=42.0.0",
    "slowapi>=0.1.9",
    "openai>=2.0.0",
    "stripe>=10.0.0",
    "structlog>=24.1.0",
    "tenacity>=8.3.0",
    "aiofiles>=23.2.1",
    "python-dotenv>=1.0.0",
    "email-validator>=2.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "factory-boy>=3.3.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "ANN", "S", "B", "A", "COM", "C4", "DTZ", "T20", "RET", "SIM", "ARG", "PTH", "ERA"]
ignore = [
    "ANN401", # Existing FastAPI/service code uses Any at API boundaries.
    "B008",   # FastAPI dependency defaults intentionally call File/Depends helpers.
    "COM812", # Avoid conflict with formatter.
    "E501",   # Line-length debt is tracked; keep CI focused on behavioral lint.
    "S101",   # Pytest uses assert.
    "S105",   # Test placeholder strings are not secrets.
    "S108",   # Local development defaults intentionally point at /tmp storage.
]

[tool.ruff.lint.per-file-ignores]
"alembic/**" = ["ANN", "E402", "ERA", "F403", "I001", "UP", "W"]
"tests/**" = ["ANN", "ARG", "DTZ", "I001", "S"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
